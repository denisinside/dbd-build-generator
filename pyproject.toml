[project]
name = "dbd-build-generator"
version = "0.1.0"
description = "AI-powered Dead by Daylight build generator"
readme = "README.md"
authors = [
    { name = "denisinside", email = "d.shvachka@ukma.edu.ua" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "beautifulsoup4==4.14.3",
    "chromadb==1.5.5",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "langchain-openrouter>=0.2.7",
    "langchain-tavily>=0.2.18",
    "openai==1.82.0",
    "pymongo==4.13.2",
    "python-dotenv==1.1.0",
    "requests==2.32.5",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
dbd-build-generator = "dbd_build_generator:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "parsers"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "chroma_db", "frontend"]

[tool.ruff.lint]
# Pinned explicitly so CI does not start failing when ruff changes defaults.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# The codebase separates the import block with two blank lines.
lines-after-imports = 2
known-first-party = ["chroma_loader", "generate_build", "schemas", "wiki_utils", "media_mirror"]
