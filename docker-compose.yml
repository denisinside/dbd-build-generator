services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Deliberately not published: an unauthenticated MongoDB on a public port
    # is found by scanners within hours. The API reaches it over the compose
    # network. Add `-p 127.0.0.1:27017:27017` by hand for local debugging.
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        # The API creates indexes on startup, so it needs a live database.
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # Built by `uv run python ingest.py`; kept outside the image so the
      # vector store survives rebuilds.
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side calls stay inside the compose network.
      API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
